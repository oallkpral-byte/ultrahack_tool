name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install psutil pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name "UltraHack_Tool" ultrahack_tool.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: UltraHack_Tool
        path: dist/UltraHack_Tool.exe
